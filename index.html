<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yopiq doira uchun eksklyuziv marshrutlar: xususiy jetlar, to‘liq maxfiylik va olomonni chetlab o‘tish imtiyozi."
    />
    <meta name="theme-color" content="#050505" />
    <title>TIAN SHAN — tadbirkorlar uchun premium sayohatlar</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #050505;
      }
      #boot-splash svg {
        width: auto;
        height: 3.5rem;
        opacity: 0;
        animation: boot-logo-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
      }
      #boot-splash .boot-line {
        width: min(180px, 40vw);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(104, 199, 203, 0.9), transparent);
        transform: scaleX(0);
        animation: boot-line-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }
      #boot-splash .boot-tag {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        opacity: 0;
        animation: boot-tag-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
      }
      @keyframes boot-logo-in {
        from {
          opacity: 0;
          transform: scale(0.78);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      @keyframes boot-line-in {
        from {
          transform: scaleX(0);
          opacity: 0;
        }
        to {
          transform: scaleX(1);
          opacity: 1;
        }
      }
      @keyframes boot-tag-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 300 70" height="56" role="img" aria-label="TIAN SHAN Travel" xmlns="http://www.w3.org/2000/svg">

          />
          <path
            d="M66 39.1 L63 42.7 L60 46.9 L57.5 51 L55.5 54.7 L54 58.9 L52.5 63 L52 67.2 L52.5 70.8 L54.5 75 L56.5 79.2 L58.5 83.3 L60.5 87 L70 91.2 L80.5 95.3 L91 99.5 Q91.8 101 94.2 100.2 L95.2 97.5 L93.5 95.3 L91.5 91.2 L89.5 87 L88 83.3 L85.5 79.2 L83.5 75 L81.5 70.8 L80 67.2 L78 63 L76 58.9 L74 54.7 L72.5 51 L70.5 46.9 L68.5 42.7 L66.5 39.1 Z"

        </g>
        <line x1="78" y1="12" x2="78" y2="58" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
        <text
          x="92"
          y="33"
          fill="#FFFFFF"
          font-family="system-ui, sans-serif"
          font-size="22"
          font-weight="700"
          letter-spacing="0.06em"
        >
          TIAN SHAN
        </text>
        <text
          x="92"
          y="54"
          fill="#FFFFFF"
          font-family="system-ui, sans-serif"
          font-size="11"
          font-weight="500"
          letter-spacing="0.48em"
          textLength="148"
          lengthAdjust="spacing"
        >
          TRAVEL
        </text>
      </svg>
      <div class="boot-line"></div>
      <p class="boot-tag">Central Asia</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
